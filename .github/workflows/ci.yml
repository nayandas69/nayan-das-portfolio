# -----------------------------------------------------------
# CI -- Nayan Das Portfolio
# -----------------------------------------------------------
# Single workflow that validates code quality on every push
# and pull request against the all branch.
#
# Steps run sequentially so failures surface in a logical
# order: format -> test -> build -> production smoke.
#
# Matrix: Node 24 (Matching package.json)
# -----------------------------------------------------------

name: CI

on:
  push:
  pull_request:

# Cancel in-progress runs for the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Run every node version even if one fails
      fail-fast: false
      matrix:
        node-version: [24]

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # ---- pnpm ----
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      # ---- Node ----
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # ---- Install ----
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- Format check ----
      - name: Check formatting (Prettier)
        run: pnpm format:check

      # ---- Tests ----
      - name: Run tests (Vitest)
        run: pnpm test

      - name: Prepare blog smoke fixtures
        run: node scripts/blog-smoke-fixtures.mjs prepare

      # ---- Build ----
      - name: Build project (Nuxt)
        run: pnpm build

      # ---- Production blog routes and metadata ----
      - name: Smoke test production blog
        env:
          PORT: 3000
          HOST: 127.0.0.1
        run: |
          node .output/server/index.mjs > /tmp/portfolio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:$PORT/blog" > /dev/null; then
              pnpm test:blog:smoke "http://127.0.0.1:$PORT"
              exit $?
            fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1

      - name: Clean up blog smoke fixtures
        if: always()
        run: node scripts/blog-smoke-fixtures.mjs cleanup
