onlyBuiltDependencies:
  - sass-embedded
  - sharp

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

# pnpm 12 fails the install when a dependency's build script is ignored.
# These two are deliberately skipped above (their native binaries arrive as
# optional dependencies), so keep that a warning instead of a hard error.
strictDepBuilds: false

minimumReleaseAgeExclude:
  - happy-dom@21.0.4
  - sass-embedded-all-unknown@1.106.0
  - sass-embedded-android-arm64@1.106.0
  - sass-embedded-android-arm@1.106.0
  - sass-embedded-android-riscv64@1.106.0
  - sass-embedded-android-x64@1.106.0
  - sass-embedded-darwin-arm64@1.106.0
  - sass-embedded-darwin-x64@1.106.0
  - sass-embedded-linux-arm64@1.106.0
  - sass-embedded-linux-arm@1.106.0
  - sass-embedded-linux-musl-arm64@1.106.0
  - sass-embedded-linux-musl-arm@1.106.0
  - sass-embedded-linux-musl-riscv64@1.106.0
  - sass-embedded-linux-musl-x64@1.106.0
  - sass-embedded-linux-riscv64@1.106.0
  - sass-embedded-linux-x64@1.106.0
  - sass-embedded-unknown-all@1.106.0
  - sass-embedded-win32-arm64@1.106.0
  - sass-embedded-win32-x64@1.106.0
  - sass-embedded@1.106.0
  - sass@1.106.0

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
